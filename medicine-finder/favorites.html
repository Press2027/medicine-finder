<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Favorites | Pharmacy Medicine Finder</title>

  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="header-content">

      <h1 class="site-title">
        💊 Pharmacy Medicine Finder
      </h1>

      <nav>
        <ul>

          <li>
            <a href="./index.html">
              Home
            </a>
          </li>

          <li>
            <a
              href="./favorites.html"
              class="active"
            >
              Favorites
            </a>
          </li>

          <li>
            <a href="./pharmacies.html">
              Pharmacies
            </a>
          </li>

        </ul>
      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <section class="favorites-section">

      <div class="favorites-header">

        <div class="favorites-title-group">

          <h2>
            Favorite Medicines
          </h2>

          <span
            id="favoritesCount"
            class="favorites-count"
          >
            0
          </span>

        </div>


        <button
          id="clearFavorites"
          class="clear-btn"
          type="button"
        >
          Clear All
        </button>

      </div>


      <!-- FAVORITES LIST -->

      <div id="favoritesList">

        <div class="empty">

          <h2>
            No Favorite Medicines
          </h2>

          <p>
            You haven't saved any favorite medicines yet.
          </p>

          <a
            href="./index.html"
            class="home-btn"
          >
            ← Go back to search medicines
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <p>
      WDD 330 Class Project
    </p>

    <p>
      Preston Machanga
    </p>

    <p>
      &copy;
      <span id="year"></span>
      Pharmacy Medicine Finder
    </p>

    <p>
      Last Modified:
      <span id="lastModified"></span>
    </p>

  </footer>


  <!-- =========================
       FOOTER SCRIPT
  ========================== -->

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("lastModified").textContent =
      document.lastModified;
  </script>


  <!-- =========================
       FAVORITES JAVASCRIPT
  ========================== -->

  <script
    type="module"
    src="./src/favorites.js">
  </script>

</body>

</html>
